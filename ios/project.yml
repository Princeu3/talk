# Generate the Xcode project with `xcodegen` in this folder; Talk.xcodeproj is not checked in.
name: Talk
options:
  bundleIdPrefix: dev.princeuniverse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: RMVX38Q6NU
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "12"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 156.0.0
targets:
  Talk:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: NotificationService
      - target: Share
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.princeuniverse.talk
        # iPhone only; on the project it loses to XcodeGen's per-target "1,2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Talk
        # XcodeGen writes literal 1.0 / 1 otherwise, so the settings above would never reach the build
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [voip, audio]
        NSMicrophoneUsageDescription: Talk uses the microphone for calls and voice messages.
        NSCameraUsageDescription: Talk uses the camera for video calls and photos you send.
        NSUserActivityTypes: [INStartCallIntent, INSendMessageIntent]
        NSLocalNetworkUsageDescription: Talk connects calls directly over your local network when the other person is nearby.
        # http only to local dev servers; real servers are https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Talk.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)dev.princeuniverse.talk.shared]
        com.apple.developer.usernotifications.communication: true
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NSE, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.princeuniverse.talk.notifications
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NSE/Info.plist
      properties:
        CFBundleDisplayName: Talk Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NSE/NotificationService.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.princeuniverse.talk.shared]
  # "Talk" in the share sheet: screenshots, photos, files, text and links to a chat.
  Share:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
      - App/Socket.swift
      - App/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.princeuniverse.talk.share
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Lets the share sheet's top row suggest Talk chats (from the notification donations).
            IntentsSupported: [INSendMessageIntent]
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Share/Share.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.princeuniverse.talk.shared]
  TalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
      - App/PeerConfig.swift
      - App/PiPFeed.swift
      - App/Socket.swift
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.princeuniverse.talk.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Talk:
    build:
      targets:
        Talk: all
    test:
      targets: [TalkTests]
